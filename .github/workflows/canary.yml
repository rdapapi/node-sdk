name: Canary

# Probes production through the built package, so a contract change upstream
# turns this red even while the fixture-driven CI stays green. Never runs on
# push or pull_request: the repo is public and the job holds an API key.
on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  canary:
    name: Probe production
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v6

      # Pinned to 24 rather than CI's matrix: the probe is TypeScript run
      # through Node's type stripping.
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Run the probes
        env:
          RDAPAPI_API_KEY: ${{ secrets.RDAPAPI_API_KEY }}
        run: |
          if [ -z "$RDAPAPI_API_KEY" ]; then
            echo "::warning::RDAPAPI_API_KEY is not configured; skipping the canary."
            exit 0
          fi
          npm run canary
